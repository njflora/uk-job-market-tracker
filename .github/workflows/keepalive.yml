# Keeps the daily ingest running when nobody has committed for a while.
#
# GitHub turns off scheduled workflows in a public repository after 60 days
# with no repository activity. On the 1st of each month this job checks the
# date of the last commit. If it is more than 45 days old, it pushes one empty
# commit, which counts as activity. It also re-enables the ingest and backup
# workflows in case they were already turned off.
#
# This job is itself scheduled, so the empty commit keeps it alive too.
# Your local copy will then be one commit behind: run `git pull` before your next push.
name: Keep schedules alive

on:
  schedule:
    - cron: "41 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit if the repository has been quiet for 45 days
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was $days days ago."
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled workflows alive"
            git push
          else
            echo "Recent enough. Nothing to do."
          fi

      - name: Make sure the scheduled workflows are switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable ingest.yml
          gh workflow enable backup.yml
